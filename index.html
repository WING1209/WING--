<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WINGお絵描きPV作成</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "Meiryo", sans-serif;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffde59;
    font-size: 13px;
  }

  /* スマホ縦画面警告 */
  #portrait-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #ff4757;
    color: #ffffff;
    z-index: 9999;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 16px;
  }
  #portrait-overlay.show {
    display: flex;
  }
  .rotate-mark {
    font-size: 44px;
    font-weight: bold;
    margin-bottom: 10px;
  }

  /* 画面コンテナ（全画面固定） */
  .screen {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 8px 12px;
    background-color: #ffde59;
    background-image: radial-gradient(#ffbe44 18%, transparent 18%);
    background-size: 28px 28px;
    overflow: hidden;
  }
  .screen.active {
    display: flex;
  }

  /* 右上：スマホ／PC切替バー */
  .mode-switch-bar {
    position: fixed;
    top: 6px;
    right: 8px;
    z-index: 500;
    background: rgba(255, 255, 255, 0.95);
    border: 2px solid #222222;
    border-radius: 20px;
    padding: 2px 6px;
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: bold;
  }
  .switch-btn {
    border: none;
    background: transparent;
    color: #222222;
    font-size: 11px;
    font-weight: bold;
    padding: 3px 8px;
    border-radius: 14px;
    cursor: pointer;
  }
  .switch-btn.active {
    background: #ff4757;
    color: #ffffff;
  }

  /* POPボタン */
  .pop-btn {
    display: inline-block;
    background: #ff4757;
    color: #ffffff;
    border: 3px solid #222222;
    border-radius: 14px;
    padding: 8px 18px;
    margin: 5px;
    font-size: 14px;
    font-weight: bold;
    box-shadow: 0 4px 0 #222222;
    cursor: pointer;
  }
  .pop-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #222222;
  }
  .pop-btn.blue { background: #1e90ff; }
  .pop-btn.green { background: #2ed573; color: #111111; }
  .pop-btn.purple { background: #9b59b6; }
  .pop-btn.gray { background: #dcdde1; color: #222222; }
  .pop-btn:disabled {
    opacity: 0.45;
    cursor: default;
  }

  /* タイトル画面 */
  #screen-title {
    cursor: pointer;
  }
  .pop-title {
    font-size: 32px;
    font-weight: 900;
    color: #ff3838;
    text-align: center;
    line-height: 1.2;
    text-shadow: 2px 2px 0 #ffffff, -2px -2px 0 #ffffff, 2px -2px 0 #ffffff, -2px 2px 0 #ffffff, 0 5px 0 #222222;
  }
  .pop-title .sub {
    color: #1e90ff;
  }
  .blink-start {
    margin-top: 22px;
    background: #222222;
    color: #ffffff;
    border: 3px solid #ffffff;
    border-radius: 30px;
    padding: 8px 24px;
    font-size: 18px;
    font-weight: bold;
    animation: startBlink 0.9s infinite alternate;
  }
  @keyframes startBlink {
    from { opacity: 1; }
    to { opacity: 0.3; }
  }
  .version-badge {
    position: fixed;
    bottom: 10px;
    right: 12px;
    background: #ffffff;
    color: #222222;
    border: 2px solid #222222;
    border-radius: 12px;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: bold;
    box-shadow: 0 2px 0 #222222;
    pointer-events: none;
  }

  /* カード枠 */
  .panel-card {
    background: #ffffff;
    border: 3px solid #222222;
    border-radius: 18px;
    padding: 12px 18px;
    box-shadow: 0 5px 0 #222222;
    text-align: center;
    max-width: 96%;
    max-height: 92%;
    overflow-y: auto;
  }
  .panel-heading {
    margin: 0 0 10px 0;
    font-size: 15px;
    font-weight: bold;
    color: #222222;
  }

  /* マルチ画面用 */
  .pass-box {
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 8px;
    background: #f1f2f6;
    border: 3px dashed #222222;
    border-radius: 12px;
    padding: 8px 16px;
    margin: 10px 0;
    color: #ff3838;
  }
  .pass-input, .count-select {
    font-size: 16px;
    font-weight: bold;
    padding: 6px 10px;
    border: 3px solid #222222;
    border-radius: 10px;
    text-align: center;
    width: 140px;
  }

  /* 透明色パレット選択画面（大きめ升目・小さめ文字） */
  #screen-transparent .panel-card {
    width: 96%;
    height: 90%;
    display: flex;
    flex-direction: column;
    padding: 8px 12px;
  }
  .trans-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    flex-shrink: 0;
  }
  .trans-top-title {
    font-size: 13px;
    font-weight: bold;
    margin: 0;
  }
  .trans-top-note {
    font-size: 10px;
    color: #555555;
    margin: 0;
  }
  #trans-palette-grid {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(14, 1fr);
    gap: 4px;
    background: #222222;
    padding: 5px;
    border-radius: 8px;
  }
  body.is-pc #trans-palette-grid {
    grid-template-columns: repeat(20, 1fr);
  }
  .trans-swatch {
    min-height: 26px;
    border-radius: 4px;
    border: 1px solid rgba(255, 255, 255, 0.35);
    cursor: pointer;
  }

  /* モーダル共通 */
  .modal-bg {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.75);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 10px;
  }
  .modal-bg.open {
    display: flex;
  }
  .big-swatch {
    width: 100px;
    height: 100px;
    border: 4px solid #222222;
    border-radius: 16px;
    margin: 8px auto;
    box-shadow: 0 4px 0 #222222;
  }

  /* お絵描き画面 */
  #screen-draw {
    flex-direction: row;
    justify-content: space-between;
    align-items: stretch;
    background: #3b3b3b;
    padding: 6px;
    gap: 6px;
  }
  #canvas-area {
    flex: 1;
    height: 100%;
    position: relative;
    background: #575757;
    border: 2px solid #222222;
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    touch-action: none;
  }
  #canvas-box {
    position: relative;
    width: 480px;
    height: 300px;
    transform-origin: center center;
    background-color: #ffffff;
    background-image:
      linear-gradient(45deg, #cccccc 25%, transparent 25%),
      linear-gradient(-45deg, #cccccc 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #cccccc 75%),
      linear-gradient(-45deg, transparent 75%, #cccccc 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
  }
  #paint-canvas, #grid-overlay-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 480px;
    height: 300px;
  }
  #grid-overlay-canvas {
    pointer-events: none;
    display: none;
  }
  .canvas-tag {
    position: absolute;
    top: 6px;
    left: 6px;
    z-index: 20;
    background: rgba(0, 0, 0, 0.72);
    color: #ffffff;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 10px;
    pointer-events: none;
  }
  .zoom-reset {
    position: absolute;
    bottom: 6px;
    left: 6px;
    z-index: 20;
    background: rgba(255, 255, 255, 0.92);
    color: #222222;
    border: 2px solid #222222;
    border-radius: 8px;
    font-size: 10px;
    font-weight: bold;
    padding: 2px 7px;
    cursor: pointer;
  }

  /* 右側GUI */
  #side-gui {
    width: 220px;
    height: 100%;
    background: #ffffff;
    border: 3px solid #222222;
    border-radius: 10px;
    padding: 4px;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  body.is-pc #side-gui {
    width: 255px;
  }
  .tool-btns {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    margin-bottom: 4px;
    flex-shrink: 0;
  }
  .t-btn {
    position: relative;
    background: #f1f2f6;
    color: #222222;
    border: 2px solid #222222;
    border-radius: 7px;
    padding: 3px 2px;
    font-size: 10px;
    font-weight: bold;
    cursor: pointer;
    line-height: 1.15;
  }
  .t-btn.selected {
    background: #ffde59;
    border-color: #ff3838;
  }
  .t-sub {
    display: block;
    font-size: 8px;
    color: #555555;
  }
  #size-bar {
    display: none;
    background: #2f3542;
    color: #ffffff;
    border-radius: 6px;
    padding: 3px;
    margin-bottom: 4px;
    justify-content: space-around;
    align-items: center;
    flex-shrink: 0;
  }
  #size-bar.show {
    display: flex;
  }
  .sz-choice {
    background: #57606f;
    color: #ffffff;
    border: 1px solid #ffffff;
    border-radius: 5px;
    padding: 2px 6px;
    font-size: 10px;
    font-weight: bold;
    cursor: pointer;
  }
  .sz-choice.active {
    background: #ff4757;
  }

  /* GUI下部パレット */
  #side-palette {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    background: #222222;
    border: 2px solid #222222;
    border-radius: 6px;
    padding: 3px;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 2px;
    align-content: start;
  }
  .p-chip {
    aspect-ratio: 1 / 1;
    border-radius: 2px;
    cursor: pointer;
    position: relative;
  }
  .p-chip.active-chip {
    outline: 2px solid #ffffff;
    z-index: 2;
  }
  .p-chip.blocked-chip {
    opacity: 0.15;
    pointer-events: none;
  }

  /* プレビュー画面 */
  #preview-stage {
    border: 3px solid #222222;
    background: #ffffff;
    max-width: 100%;
    max-height: 42vh;
    width: auto;
    height: auto;
    aspect-ratio: 480 / 300;
    display: block;
    margin: 0 auto 6px auto;
  }
</style>
</head>
<body>

<!-- スマホ縦画面警告 -->
<div id="portrait-overlay">
  <div class="rotate-mark">↻</div>
  <div style="font-size:16px; font-weight:bold; margin-bottom:6px;">スマホは横画面専用です</div>
  <div style="font-size:12px;">横向きにするか、右上の「PC」切替を押してください</div>
</div>

<!-- スマホ／PC切替スイッチ -->
<div class="mode-switch-bar" onclick="event.stopPropagation()">
  <span>表示:</span>
  <button type="button" class="switch-btn" id="sw-mobile" onclick="applyDevice('mobile')">スマホ</button>
  <button type="button" class="switch-btn" id="sw-pc" onclick="applyDevice('pc')">PC</button>
</div>

<!-- 1. タイトル画面 -->
<div id="screen-title" class="screen active">
  <div class="pop-title">WING<span class="sub">お絵描き</span><br>PV作成</div>
  <div class="blink-start" id="btn-title-start">スタート</div>
  <div class="version-badge" id="app-version-badge">Ver 1.0</div>
</div>

<!-- 2. メニュー1：人数選択 -->
<div id="screen-menu1" class="screen">
  <div class="panel-card">
    <h2 class="panel-heading">モード選択</h2>
    <button type="button" class="pop-btn blue" onclick="chooseMode1('single')">① 一人</button>
    <button type="button" class="pop-btn purple" onclick="chooseMode1('multi')">② マルチ（5人まで）</button>
  </div>
</div>

<!-- 2-2. マルチ：ホスト／ゲスト -->
<div id="screen-multi-role" class="screen">
  <div class="panel-card">
    <h2 class="panel-heading">マルチプレイ</h2>
    <button type="button" class="pop-btn" onclick="showScreen('screen-host-count')">ホスト</button>
    <button type="button" class="pop-btn blue" onclick="showScreen('screen-guest-pass')">ゲスト</button>
    <br>
    <button type="button" class="pop-btn gray" style="font-size:12px; padding:5px 14px;" onclick="showScreen('screen-menu1')">もどる</button>
  </div>
</div>

<!-- 2-3. ホスト：人数選択 -->
<div id="screen-host-count" class="screen">
  <div class="panel-card">
    <h2 class="panel-heading">何人で遊ぶ？（2〜5人）</h2>
    <select id="select-players" class="count-select">
      <option value="2">2人</option>
      <option value="3">3人</option>
      <option value="4">4人</option>
      <option value="5">5人</option>
    </select>
    <br><br>
    <button type="button" class="pop-btn green" onclick="makeHostRoom()">決定</button>
    <button type="button" class="pop-btn gray" onclick="showScreen('screen-multi-role')">もどる</button>
  </div>
</div>

<!-- 2-4. ホスト：4桁パス表示・接続まち -->
<div id="screen-host-wait" class="screen">
  <div class="panel-card">
    <h2 class="panel-heading">4桁パス（接続まち）</h2>
    <div class="pass-box" id="room-pass-text">0000</div>
    <div id="host-wait-label" style="font-size:12px; margin-bottom:8px;">接続まち... (1/2人)</div>
    <button type="button" class="pop-btn green" onclick="showScreen('screen-menu2')">全員接続して次へ</button>
  </div>
</div>

<!-- 2-5. ゲスト：パス入力 -->
<div id="screen-guest-pass" class="screen">
  <div class="panel-card">
    <h2 class="panel-heading">4桁パスを入力</h2>
    <input type="text" id="input-pass" class="pass-input" maxlength="4" placeholder="1234">
    <br><br>
    <button type="button" class="pop-btn blue" onclick="connectGuest()">接続</button>
    <button type="button" class="pop-btn gray" onclick="showScreen('screen-multi-role')">もどる</button>
  </div>
</div>

<!-- 2-6. ゲスト：待機画面 -->
<div id="screen-guest-wait" class="screen">
  <div class="panel-card">
    <h2 class="panel-heading">待機中</h2>
    <div style="font-size:12px; margin-bottom:10px;">つながりました。開始を待っています...</div>
    <button type="button" class="pop-btn green" style="font-size:12px;" onclick="showScreen('screen-menu2')">（次へ進む）</button>
  </div>
</div>

<!-- 3. メニュー2：ゲームモード選択 -->
<div id="screen-menu2" class="screen">
  <div class="panel-card">
    <h2 class="panel-heading">ゲームモード選択</h2>
    <button type="button" class="pop-btn" onclick="chooseGameMode('anim')">（１）アニメーション素材</button><br>
    <button type="button" class="pop-btn blue" onclick="chooseGameMode('bg')">（２）背景</button><br>
    <button type="button" class="pop-btn purple" onclick="alert('（３）PV（合体）はアニメ素材・背景作成後に組み合わせるモードです')">（３）PV（合体）</button>
  </div>
</div>

<!-- 4. 透明色選択（250色パレット・大きめ表示） -->
<div id="screen-transparent" class="screen">
  <div class="panel-card">
    <div class="trans-top">
      <div>
        <div class="trans-top-title">透明色を選択</div>
        <div class="trans-top-note">タップすると拡大確認が出ます（選択色はパレットで選択不可）</div>
      </div>
      <button type="button" class="pop-btn gray" style="font-size:11px; padding:4px 10px; margin:0;" onclick="showScreen('screen-menu2')">もどる</button>
    </div>
    <div id="trans-palette-grid"></div>
  </div>
</div>

<!-- 4-2. 透明色確認ダイアログ -->
<div id="modal-trans-confirm" class="modal-bg">
  <div class="panel-card">
    <div style="font-size:13px; font-weight:bold;">この色で良いですか？</div>
    <div id="trans-big-box" class="big-swatch"></div>
    <div id="trans-hex-label" style="font-size:11px; color:#444; margin-bottom:6px;"></div>
    <button type="button" class="pop-btn green" style="padding:6px 18px; font-size:13px;" onclick="confirmTrans(true)">はい</button>
    <button type="button" class="pop-btn gray" style="padding:6px 18px; font-size:13px;" onclick="confirmTrans(false)">いいえ</button>
  </div>
</div>

<!-- 5. お絵描き画面（480×300固定） -->
<div id="screen-draw" class="screen">
  <div id="canvas-area">
    <div class="canvas-tag" id="frame-info">1枚目 / 最大10枚</div>
    <button type="button" class="zoom-reset" onclick="resetCanvasView()">ズームリセット</button>
    <div id="canvas-box">
      <canvas id="paint-canvas" width="480" height="300"></canvas>
      <canvas id="grid-overlay-canvas" width="480" height="300"></canvas>
    </div>
  </div>

  <div id="side-gui">
    <div class="tool-btns">
      <button type="button" class="t-btn selected" id="btn-tool-pen" onclick="selectTool('pen')">
        ペン<span class="t-sub" id="lbl-pen">4px</span>
      </button>
      <button type="button" class="t-btn" id="btn-tool-eraser" onclick="selectTool('eraser')">
        消しゴム<span class="t-sub" id="lbl-eraser">10px</span>
      </button>
      <button type="button" class="t-btn" id="btn-tool-fill" onclick="selectTool('fill')">
        塗つぶし<span class="t-sub" id="lbl-fill">標準</span>
      </button>
      <button type="button" class="t-btn" id="btn-tool-grid" onclick="toggleGrid()">
        グリッド<span class="t-sub">72×60</span>
      </button>
      <button type="button" class="t-btn" onclick="doUndo()">
        ←<span class="t-sub">戻す</span>
      </button>
      <button type="button" class="t-btn" onclick="doRedo()">
        →<span class="t-sub">次動作</span>
      </button>
      <button type="button" class="t-btn" onclick="savePNG()">
        保存<span class="t-sub">PNG</span>
      </button>
      <button type="button" class="t-btn" id="btn-next-page" onclick="goNextFrame()">
        次へ<span class="t-sub">最大10枚</span>
      </button>
      <button type="button" class="t-btn" style="background:#2ed573;" onclick="openAnimPreview()">
        完了<span class="t-sub">再生</span>
      </button>
    </div>

    <div id="size-bar"></div>
    <div id="side-palette"></div>
  </div>
</div>

<!-- 6. アニメーションプレビュー画面 -->
<div id="modal-preview" class="modal-bg">
  <div class="panel-card">
    <div style="font-size:13px; font-weight:bold; margin-bottom:4px;">アニメーションプレビュー</div>
    <canvas id="preview-stage" width="480" height="300"></canvas>
    <div style="font-size:11px; font-weight:bold; margin-bottom:6px;">
      スピード: <span id="speed-val">200</span>ms<br>
      <input type="range" id="speed-range" min="50" max="1000" step="50" value="200" style="width:180px;" oninput="changeSpeed(this.value)">
    </div>
    <button type="button" class="pop-btn green" style="padding:6px 14px; font-size:12px;" onclick="saveAnimationFile()">保存</button>
    <button type="button" class="pop-btn gray" style="padding:6px 14px; font-size:12px;" onclick="closeAnimPreview()">もどる</button>
  </div>
</div>

<!-- 7. 保存後メニュー戻り確認ダイアログ -->
<div id="modal-saved-dialog" class="modal-bg">
  <div class="panel-card">
    <div style="font-size:14px; font-weight:bold; margin-bottom:8px;">メニュー画面へ戻りますか？</div>
    <button type="button" class="pop-btn blue" style="padding:6px 18px; font-size:13px;" onclick="afterSaveChoice(true)">はい</button>
    <button type="button" class="pop-btn gray" style="padding:6px 18px; font-size:13px;" onclick="afterSaveChoice(false)">いいえ</button>
  </div>
</div>

<script>
(function() {
  "use strict";

  var APP_VERSION = "Ver 1.0";
  document.getElementById("app-version-badge").textContent = APP_VERSION;

  /* ----------------------------
     カラーパレット（250色）生成
  ---------------------------- */
  var colors250 = [];
  for (var g = 0; g < 10; g++) {
    var v = Math.round((255 / 9) * g);
    var vh = v.toString(16);
    if (vh.length < 2) vh = "0" + vh;
    colors250.push("#" + vh + vh + vh);
  }
  var toneList = [
    [100, 85], [100, 70], [100, 55], [100, 45], [100, 30],
    [70, 80],  [70, 60],  [70, 40],  [45, 75],  [45, 45]
  ];
  for (var h = 0; h < 24; h++) {
    var deg = Math.round((360 / 24) * h);
    for (var t = 0; t < toneList.length; t++) {
      colors250.push(hslToHex(deg, toneList[t][0], toneList[t][1]));
    }
  }

  function hslToHex(h, s, l) {
    s /= 100;
    l /= 100;
    var c = (1 - Math.abs(2 * l - 1)) * s;
    var x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    var m = l - c / 2;
    var r = 0, gr = 0, b = 0;
    if (h < 60) { r = c; gr = x; }
    else if (h < 120) { r = x; gr = c; }
    else if (h < 180) { gr = c; b = x; }
    else if (h < 240) { gr = x; b = c; }
    else if (h < 300) { r = x; b = c; }
    else { r = c; b = x; }
    function to2(n) {
      var hx = Math.round((n + m) * 255).toString(16);
      return hx.length < 2 ? "0" + hx : hx;
    }
    return "#" + to2(r) + to2(gr) + to2(b);
  }

  /* ----------------------------
     アプリ状態
  ---------------------------- */
  var state = {
    device: "pc",
    playMode: "single",
    gameMode: "anim",
    transparentColor: null,
    tempTransparentColor: null,
    drawColor: "#000000",
    tool: "pen",
    penSize: 4,
    eraserSize: 10,
    fillTol: 25,
    gridOn: false,
    frames: [],
    frameIdx: 0,
    undoList: [],
    redoList: []
  };

  /* ----------------------------
     スマホ／PC判別＆縦画面チェック
  ---------------------------- */
  function detectInitialDevice() {
    var touch = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);
    var small = Math.min(window.screen.width || window.innerWidth, window.screen.height || window.innerHeight) <= 820;
    return (touch && small) ? "mobile" : "pc";
  }

  window.applyDevice = function(mode) {
    state.device = mode;
    if (mode === "pc") {
      document.body.classList.add("is-pc");
      document.body.classList.remove("is-mobile");
      document.getElementById("sw-pc").className = "switch-btn active";
      document.getElementById("sw-mobile").className = "switch-btn";
    } else {
      document.body.classList.add("is-mobile");
      document.body.classList.remove("is-pc");
      document.getElementById("sw-mobile").className = "switch-btn active";
      document.getElementById("sw-pc").className = "switch-btn";
    }
    checkPortraitOverlay();
    fitDrawCanvas();
  };

  function checkPortraitOverlay() {
    var ov = document.getElementById("portrait-overlay");
    var isPortrait = window.innerHeight > window.innerWidth;
    if (state.device === "mobile" && isPortrait) {
      ov.className = "show";
    } else {
      ov.className = "";
    }
  }

  /* ----------------------------
     画面遷移
  ---------------------------- */
  window.showScreen = function(id) {
    var list = document.querySelectorAll(".screen");
    for (var i = 0; i < list.length; i++) {
      list[i].classList.remove("active");
    }
    var el = document.getElementById(id);
    if (el) el.classList.add("active");
    if (id === "screen-draw") {
      setTimeout(fitDrawCanvas, 20);
    }
  };

  document.getElementById("screen-title").addEventListener("click", function() {
    window.showScreen("screen-menu1");
  });
  document.getElementById("btn-title-start").addEventListener("click", function(e) {
    e.stopPropagation();
    window.showScreen("screen-menu1");
  });

  window.chooseMode1 = function(m) {
    state.playMode = m;
    if (m === "single") {
      window.showScreen("screen-menu2");
    } else {
      window.showScreen("screen-multi-role");
    }
  };

  window.makeHostRoom = function() {
    var cnt = document.getElementById("select-players").value;
    var pass = String(Math.floor(1000 + Math.random() * 9000));
    document.getElementById("room-pass-text").textContent = pass;
    document.getElementById("host-wait-label").textContent = "接続まち... (1/" + cnt + "人)";
    window.showScreen("screen-host-wait");
  };

  window.connectGuest = function() {
    var p = document.getElementById("input-pass").value;
    if (!/^\d{4}$/.test(p)) {
      alert("4桁の数字を入力してください");
      return;
    }
    window.showScreen("screen-guest-wait");
  };

  window.chooseGameMode = function(gm) {
    state.gameMode = gm;
    if (gm === "anim") {
      buildTransparentPalette();
      window.showScreen("screen-transparent");
    } else {
      state.transparentColor = null;
      startPaintSession();
      window.showScreen("screen-draw");
    }
  };

  function buildTransparentPalette() {
    var grid = document.getElementById("trans-palette-grid");
    grid.innerHTML = "";
    for (var i = 0; i < colors250.length; i++) {
      (function(hex) {
        var cell = document.createElement("div");
        cell.className = "trans-swatch";
        cell.style.backgroundColor = hex;
        cell.onclick = function() {
          state.tempTransparentColor = hex;
          document.getElementById("trans-big-box").style.backgroundColor = hex;
          document.getElementById("trans-hex-label").textContent = hex.toUpperCase();
          document.getElementById("modal-trans-confirm").classList.add("open");
        };
        grid.appendChild(cell);
      })(colors250[i]);
    }
  }

  window.confirmTrans = function(yes) {
    document.getElementById("modal-trans-confirm").classList.remove("open");
    if (yes && state.tempTransparentColor) {
      state.transparentColor = state.tempTransparentColor;
      startPaintSession();
      window.showScreen("screen-draw");
    } else {
      state.tempTransparentColor = null;
    }
  };

  /* ----------------------------
     お絵描き・GUI
  ---------------------------- */
  var pCanvas = document.getElementById("paint-canvas");
  var pCtx = pCanvas.getContext("2d");
  var gCanvas = document.getElementById("grid-overlay-canvas");
  var gCtx = gCanvas.getContext("2d");

  function startPaintSession() {
    pCtx.clearRect(0, 0, 480, 300);
    if (state.gameMode === "bg") {
      pCtx.fillStyle = "#ffffff";
      pCtx.fillRect(0, 0, 480, 300);
    }
    var initImg = pCtx.getImageData(0, 0, 480, 300);
    state.frames = [initImg];
    state.frameIdx = 0;
    state.undoList = [initImg];
    state.redoList = [];
    refreshFrameLabel();
    buildSidePalette();
    drawGrid();
    fitDrawCanvas();
  }

  function buildSidePalette() {
    var box = document.getElementById("side-palette");
    box.innerHTML = "";
    if (state.drawColor === state.transparentColor) {
      for (var k = 0; k < colors250.length; k++) {
        if (colors250[k] !== state.transparentColor) {
          state.drawColor = colors250[k];
          break;
        }
      }
    }
    for (var i = 0; i < colors250.length; i++) {
      (function(hex) {
        var chip = document.createElement("div");
        chip.className = "p-chip";
        chip.style.backgroundColor = hex;
        if (hex === state.transparentColor) {
          chip.className += " blocked-chip";
        } else {
          if (hex === state.drawColor) chip.className += " active-chip";
          chip.onclick = function() {
            state.drawColor = hex;
            var all = box.querySelectorAll(".p-chip");
            for (var j = 0; j < all.length; j++) all[j].classList.remove("active-chip");
            chip.classList.add("active-chip");
          };
        }
        box.appendChild(chip);
      })(colors250[i]);
    }
  }

  window.selectTool = function(t) {
    var bar = document.getElementById("size-bar");
    var same = (state.tool === t);
    state.tool = t;

    document.getElementById("btn-tool-pen").classList.toggle("selected", t === "pen");
    document.getElementById("btn-tool-eraser").classList.toggle("selected", t === "eraser");
    document.getElementById("btn-tool-fill").classList.toggle("selected", t === "fill");

    if (same) {
      if (bar.classList.contains("show")) {
        bar.classList.remove("show");
      } else {
        fillSizeBar(t);
        bar.classList.add("show");
      }
    } else {
      bar.classList.remove("show");
    }
  };

  function fillSizeBar(t) {
    var bar = document.getElementById("size-bar");
    bar.innerHTML = "";
    if (t === "pen") {
      [2, 4, 8, 16].forEach(function(sz) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "sz-choice" + (state.penSize === sz ? " active" : "");
        b.textContent = sz + "px";
        b.onclick = function() {
          state.penSize = sz;
          document.getElementById("lbl-pen").textContent = sz + "px";
          bar.classList.remove("show");
        };
        bar.appendChild(b);
      });
    } else if (t === "eraser") {
      [6, 12, 24, 40].forEach(function(sz) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "sz-choice" + (state.eraserSize === sz ? " active" : "");
        b.textContent = sz + "px";
        b.onclick = function() {
          state.eraserSize = sz;
          document.getElementById("lbl-eraser").textContent = sz + "px";
          bar.classList.remove("show");
        };
        bar.appendChild(b);
      });
    } else if (t === "fill") {
      [{n:"厳密", v:5}, {n:"標準", v:25}, {n:"広め", v:60}].forEach(function(o) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "sz-choice" + (state.fillTol === o.v ? " active" : "");
        b.textContent = o.n;
        b.onclick = function() {
          state.fillTol = o.v;
          document.getElementById("lbl-fill").textContent = o.n;
          bar.classList.remove("show");
        };
        bar.appendChild(b);
      });
    }
  }

  function drawGrid() {
    gCtx.clearRect(0, 0, 480, 300);
    gCtx.strokeStyle = "rgba(0,0,0,0.35)";
    gCtx.lineWidth = 1;
    gCtx.setLineDash([3, 3]);
    for (var x = 60; x < 480; x += 60) {
      gCtx.beginPath();
      gCtx.moveTo(x, 0);
      gCtx.lineTo(x, 300);
      gCtx.stroke();
    }
    for (var y = 72; y < 300; y += 72) {
      gCtx.beginPath();
      gCtx.moveTo(0, y);
      gCtx.lineTo(480, y);
      gCtx.stroke();
    }
  }

  window.toggleGrid = function() {
    state.gridOn = !state.gridOn;
    gCanvas.style.display = state.gridOn ? "block" : "none";
    document.getElementById("btn-tool-grid").classList.toggle("selected", state.gridOn);
  };

  function pushUndo() {
    var snap = pCtx.getImageData(0, 0, 480, 300);
    state.undoList.push(snap);
    if (state.undoList.length > 25) state.undoList.shift();
    state.redoList = [];
    state.frames[state.frameIdx] = snap;
  }

  window.doUndo = function() {
    if (state.undoList.length <= 1) return;
    var cur = state.undoList.pop();
    state.redoList.push(cur);
    var prev = state.undoList[state.undoList.length - 1];
    pCtx.putImageData(prev, 0, 0);
    state.frames[state.frameIdx] = prev;
  };

  window.doRedo = function() {
    if (state.redoList.length === 0) return;
    var nxt = state.redoList.pop();
    state.undoList.push(nxt);
    pCtx.putImageData(nxt, 0, 0);
    state.frames[state.frameIdx] = nxt;
  };

  /* ----------------------------
     フィット＆ピンチズーム＆描画
  ---------------------------- */
  var cArea = document.getElementById("canvas-area");
  var cBox = document.getElementById("canvas-box");
  var fitScale = 1;
  var userScale = 1;
  var drawing = false;
  var lx = 0, ly = 0;
  var pinchStartDist = 0;
  var pinchStartScale = 1;

  function fitDrawCanvas() {
    var aw = cArea.clientWidth - 12;
    var ah = cArea.clientHeight - 12;
    if (aw <= 0 || ah <= 0) return;
    fitScale = Math.min(aw / 480, ah / 300, 1.5);
    window.resetCanvasView();
  }

  function applyCanvasScale() {
    cBox.style.transform = "scale(" + (fitScale * userScale) + ")";
  }

  window.resetCanvasView = function() {
    userScale = 1;
    applyCanvasScale();
  };

  function toLocalXY(cx, cy) {
    var r = pCanvas.getBoundingClientRect();
    return {
      x: Math.floor((cx - r.left) * (480 / r.width)),
      y: Math.floor((cy - r.top) * (300 / r.height))
    };
  }

  function strokeStart(x, y) {
    if (x < 0 || x >= 480 || y < 0 || y >= 300) return;
    if (state.tool === "fill") {
      floodFillCanvas(x, y, state.drawColor, state.fillTol);
      pushUndo();
      return;
    }
    drawing = true;
    lx = x;
    ly = y;
    paintPoint(x, y);
  }

  function strokeMove(x, y) {
    if (!drawing) return;
    pCtx.lineCap = "round";
    pCtx.lineJoin = "round";
    if (state.tool === "pen") {
      pCtx.globalCompositeOperation = "source-over";
      pCtx.strokeStyle = state.drawColor;
      pCtx.lineWidth = state.penSize;
    } else if (state.tool === "eraser") {
      pCtx.globalCompositeOperation = "destination-out";
      pCtx.lineWidth = state.eraserSize;
    }
    pCtx.beginPath();
    pCtx.moveTo(lx, ly);
    pCtx.lineTo(x, y);
    pCtx.stroke();
    lx = x;
    ly = y;
  }

  function paintPoint(x, y) {
    if (state.tool === "pen") {
      pCtx.globalCompositeOperation = "source-over";
      pCtx.fillStyle = state.drawColor;
      pCtx.beginPath();
      pCtx.arc(x, y, state.penSize / 2, 0, Math.PI * 2);
      pCtx.fill();
    } else if (state.tool === "eraser") {
      pCtx.globalCompositeOperation = "destination-out";
      pCtx.beginPath();
      pCtx.arc(x, y, state.eraserSize / 2, 0, Math.PI * 2);
      pCtx.fill();
    }
  }

  function strokeEnd() {
    drawing = false;
    pCtx.globalCompositeOperation = "source-over";
    pushUndo();
  }

  cArea.addEventListener("touchstart", function(e) {
    if (e.touches.length === 2) {
      drawing = false;
      var dx = e.touches[0].clientX - e.touches[1].clientX;
      var dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchStartDist = Math.sqrt(dx * dx + dy * dy);
      pinchStartScale = userScale;
    } else if (e.touches.length === 1) {
      var pt = toLocalXY(e.touches[0].clientX, e.touches[0].clientY);
      strokeStart(pt.x, pt.y);
    }
  }, { passive: false });

  cArea.addEventListener("touchmove", function(e) {
    e.preventDefault();
    if (e.touches.length === 2 && pinchStartDist > 0) {
      var dx = e.touches[0].clientX - e.touches[1].clientX;
      var dy = e.touches[0].clientY - e.touches[1].clientY;
      var d = Math.sqrt(dx * dx + dy * dy);
      userScale = Math.min(Math.max(0.6, pinchStartScale * (d / pinchStartDist)), 4);
      applyCanvasScale();
    } else if (e.touches.length === 1 && drawing) {
      var pt = toLocalXY(e.touches[0].clientX, e.touches[0].clientY);
      strokeMove(pt.x, pt.y);
    }
  }, { passive: false });

  cArea.addEventListener("touchend", function(e) {
    if (e.touches.length < 2) pinchStartDist = 0;
    if (drawing) strokeEnd();
  });

  pCanvas.addEventListener("mousedown", function(e) {
    var pt = toLocalXY(e.clientX, e.clientY);
    strokeStart(pt.x, pt.y);
  });
  window.addEventListener("mousemove", function(e) {
    if (!drawing) return;
    var pt = toLocalXY(e.clientX, e.clientY);
    strokeMove(pt.x, pt.y);
  });
  window.addEventListener("mouseup", function() {
    if (drawing) strokeEnd();
  });
  cArea.addEventListener("wheel", function(e) {
    e.preventDefault();
    userScale = Math.min(Math.max(0.6, userScale - e.deltaY * 0.001), 4);
    applyCanvasScale();
  }, { passive: false });

  function floodFillCanvas(sx, sy, hex, tol) {
    var img = pCtx.getImageData(0, 0, 480, 300);
    var d = img.data;
    var sp = (sy * 480 + sx) * 4;
    var sr = d[sp], sg = d[sp + 1], sb = d[sp + 2], sa = d[sp + 3];
    var fr = parseInt(hex.slice(1, 3), 16);
    var fg = parseInt(hex.slice(3, 5), 16);
    var fb = parseInt(hex.slice(5, 7), 16);
    if (sr === fr && sg === fg && sb === fb && sa === 255) return;

    var seen = new Uint8Array(480 * 300);
    var stack = [[sx, sy]];
    while (stack.length > 0) {
      var cur = stack.pop();
      var x = cur[0], y = cur[1];
      var idx = y * 480 + x;
      if (seen[idx]) continue;
      seen[idx] = 1;
      var pos = idx * 4;
      var diff = Math.abs(d[pos] - sr) + Math.abs(d[pos + 1] - sg) + Math.abs(d[pos + 2] - sb) + Math.abs(d[pos + 3] - sa);
      if (diff <= tol) {
        d[pos] = fr;
        d[pos + 1] = fg;
        d[pos + 2] = fb;
        d[pos + 3] = 255;
        if (x > 0) stack.push([x - 1, y]);
        if (x < 479) stack.push([x + 1, y]);
        if (y > 0) stack.push([x, y - 1]);
        if (y < 299) stack.push([x, y + 1]);
      }
    }
    pCtx.putImageData(img, 0, 0);
  }

  /* ----------------------------
     枚数管理（最大10枚）・プレビュー・保存
  ---------------------------- */
  function refreshFrameLabel() {
    document.getElementById("frame-info").textContent = (state.frameIdx + 1) + "枚目 (全" + state.frames.length + "枚 / 最大10枚)";
    document.getElementById("btn-next-page").disabled = (state.frameIdx >= 9);
  }

  window.goNextFrame = function() {
    if (state.frameIdx >= 9) return;
    state.frames[state.frameIdx] = pCtx.getImageData(0, 0, 480, 300);
    state.frameIdx++;
    if (state.frames[state.frameIdx]) {
      pCtx.putImageData(state.frames[state.frameIdx], 0, 0);
    } else {
      pCtx.clearRect(0, 0, 480, 300);
      if (state.gameMode === "bg") {
        pCtx.fillStyle = "#ffffff";
        pCtx.fillRect(0, 0, 480, 300);
      }
      state.frames.push(pCtx.getImageData(0, 0, 480, 300));
    }
    state.undoList = [pCtx.getImageData(0, 0, 480, 300)];
    state.redoList = [];
    refreshFrameLabel();
  };

  window.savePNG = function() {
    var a = document.createElement("a");
    a.download = "wing_frame_" + (state.frameIdx + 1) + ".png";
    a.href = pCanvas.toDataURL("image/png");
    a.click();
    document.getElementById("modal-saved-dialog").classList.add("open");
  };

  var timerId = null;
  var playIdx = 0;
  var playMs = 200;

  window.openAnimPreview = function() {
    state.frames[state.frameIdx] = pCtx.getImageData(0, 0, 480, 300);
    playIdx = 0;
    document.getElementById("modal-preview").classList.add("open");
    runPreviewLoop();
  };

  window.closeAnimPreview = function() {
    if (timerId) clearInterval(timerId);
    document.getElementById("modal-preview").classList.remove("open");
  };

  window.changeSpeed = function(v) {
    playMs = parseInt(v, 10) || 200;
    document.getElementById("speed-val").textContent = playMs;
    runPreviewLoop();
  };

  function runPreviewLoop() {
    if (timerId) clearInterval(timerId);
    var pv = document.getElementById("preview-stage");
    var pc = pv.getContext("2d");
    function step() {
      pc.clearRect(0, 0, 480, 300);
      pc.putImageData(state.frames[playIdx], 0, 0);
      playIdx = (playIdx + 1) % state.frames.length;
    }
    step();
    timerId = setInterval(step, playMs);
  }

  window.saveAnimationFile = function() {
    var sheet = document.createElement("canvas");
    sheet.width = 480 * state.frames.length;
    sheet.height = 300;
    var sctx = sheet.getContext("2d");
    var tmp = document.createElement("canvas");
    tmp.width = 480;
    tmp.height = 300;
    var tctx = tmp.getContext("2d");

    for (var i = 0; i < state.frames.length; i++) {
      tctx.clearRect(0, 0, 480, 300);
      tctx.putImageData(state.frames[i], 0, 0);
      sctx.drawImage(tmp, i * 480, 0);
    }

    var a = document.createElement("a");
    a.download = "wing_anim_sheet_" + state.frames.length + "frames.png";
    a.href = sheet.toDataURL("image/png");
    a.click();

    window.closeAnimPreview();
    document.getElementById("modal-saved-dialog").classList.add("open");
  };

  window.afterSaveChoice = function(goMenu) {
    document.getElementById("modal-saved-dialog").classList.remove("open");
    if (goMenu) {
      window.showScreen("screen-menu2");
    }
  };

  window.addEventListener("resize", function() {
    checkPortraitOverlay();
    fitDrawCanvas();
  });

  window.applyDevice(detectInitialDevice());
})();
</script>
