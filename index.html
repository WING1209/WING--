<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WINGお絵描きPV作成</title>
<!-- GIF生成用ライブラリ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap');

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    font-family: 'M PLUS Rounded 1c', sans-serif;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffde59;
  }

  /* スマホ縦画面時の警告オーバーレイ */
  #orientation-warning {
    display: none;
    position: fixed;
    inset: 0;
    background: #ff5757;
    color: #fff;
    z-index: 9999;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
  }
  #orientation-warning .icon {
    font-size: 60px;
    animation: rotatePhone 1.5s infinite ease-in-out;
  }
  @keyframes rotatePhone {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-90deg); }
  }
  @media screen and (max-width: 900px) and (orientation: portrait) {
    #orientation-warning {
      display: flex;
    }
  }

  /* 共通画面レイアウト */
  .screen {
    display: none;
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background-image: radial-gradient(#ffbd59 20%, transparent 20%), radial-gradient(#ff914d 20%, transparent 20%);
    background-color: #ffde59;
    background-position: 0 0, 25px 25px;
    background-size: 50px 50px;
  }
  .screen.active {
    display: flex;
  }

  /* POPなボタン */
  .pop-btn {
    background: #ff5757;
    color: #fff;
    border: 4px solid #333;
    border-radius: 20px;
    padding: 12px 28px;
    font-size: 1.3rem;
    font-weight: 900;
    box-shadow: 0 6px 0 #333;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    margin: 8px;
  }
  .pop-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #333;
  }
  .pop-btn.blue { background: #38b6ff; }
  .pop-btn.green { background: #7ed957; color: #222; }
  .pop-btn.purple { background: #cb6ce6; }
  .pop-btn.gray { background: #ccc; color: #333; }
  .pop-btn:disabled {
    opacity: 0.5;
    pointer-events: none;
  }

  /* タイトル画面 */
  #screen-title {
    cursor: pointer;
  }
  .title-logo {
    font-size: clamp(2.2rem, 6vw, 4.5rem);
    font-weight: 900;
    color: #ff3131;
    text-align: center;
    text-shadow: 
      4px 4px 0 #fff,
      -4px -4px 0 #fff,
      4px -4px 0 #fff,
      -4px 4px 0 #fff,
      0 8px 0 #333;
    transform: rotate(-3deg);
    animation: bounceTitle 2s infinite ease-in-out;
  }
  .title-logo span {
    display: inline-block;
    color: #38b6ff;
  }
  @keyframes bounceTitle {
    0%, 100% { transform: rotate(-3deg) scale(1); }
    50% { transform: rotate(-1deg) scale(1.05); }
  }
  .start-blink {
    margin-top: 40px;
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    font-weight: 900;
    color: #fff;
    background: #333;
    padding: 10px 30px;
    border-radius: 50px;
    border: 4px solid #fff;
    animation: blink 1s infinite alternate;
  }
  @keyframes blink {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0.3; transform: scale(0.95); }
  }

  /* カードコンテナ */
  .card-box {
    background: #fff;
    border: 5px solid #333;
    border-radius: 25px;
    padding: 25px 35px;
    box-shadow: 0 10px 0 #333;
    text-align: center;
    max-width: 90%;
    max-height: 90%;
    overflow-y: auto;
  }
  .card-title {
    font-size: 1.6rem;
    margin-top: 0;
    margin-bottom: 20px;
    color: #333;
  }

  /* マルチプレイ入力など */
  .pass-display {
    font-size: 3rem;
    font-weight: 900;
    letter-spacing: 10px;
    background: #eee;
    border: 4px dashed #333;
    border-radius: 15px;
    padding: 10px 25px;
    margin: 15px 0;
    color: #ff3131;
  }
  input[type="text"], select {
    font-size: 1.5rem;
    padding: 10px;
    border: 4px solid #333;
    border-radius: 12px;
    text-align: center;
    font-weight: bold;
    width: 180px;
  }

  /* 250色パレット選択画面 */
  #palette-250-grid {
    display: grid;
    grid-template-columns: repeat(25, 1fr);
    gap: 2px;
    width: 100%;
    max-width: 750px;
    background: #333;
    padding: 4px;
    border-radius: 8px;
    margin: 10px auto;
  }
  .color-cell {
    aspect-ratio: 1;
    cursor: pointer;
    border: 1px solid rgba(0,0,0,0.1);
  }
  .color-cell:hover {
    transform: scale(1.3);
    z-index: 2;
    border: 2px solid #fff;
  }

  /* お絵描きメイン画面 */
  #screen-draw {
    flex-direction: row;
    background: #e0e0e0;
    justify-content: space-between;
  }

  /* 左側：キャンバスエリア */
  #canvas-viewport {
    flex: 1;
    height: 100%;
    position: relative;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #555;
  }
  #canvas-wrapper {
    position: relative;
    width: 480px;
    height: 300px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    transform-origin: center center;
    /* 市松模様（透明表現） */
    background-image: 
      linear-gradient(45deg, #ccc 25%, transparent 25%), 
      linear-gradient(-45deg, #ccc 25%, transparent 25%), 
      linear-gradient(45deg, transparent 75%, #ccc 75%), 
      linear-gradient(-45deg, transparent 75%, #ccc 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    background-color: #fff;
  }
  #draw-canvas, #grid-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 480px;
    height: 300px;
  }
  #grid-canvas {
    pointer-events: none;
    display: none;
  }

  /* フレームインジケーター（左上） */
  #frame-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,0.75);
    color: #fff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.95rem;
    z-index: 10;
    pointer-events: none;
  }
  #zoom-reset-btn {
    position: absolute;
    bottom: 10px;
    left: 10px;
    background: rgba(255,255,255,0.9);
    border: 2px solid #333;
    border-radius: 12px;
    padding: 4px 10px;
    font-size: 0.8rem;
    font-weight: bold;
    z-index: 10;
    cursor: pointer;
  }

  /* 右側：GUIパネル */
  #gui-panel {
    width: 250px;
    height: 100%;
    background: #fff;
    border-left: 4px solid #333;
    display: flex;
    flex-direction: column;
    padding: 8px;
    z-index: 20;
  }
  .tool-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    margin-bottom: 6px;
  }
  .tool-btn {
    background: #f0f0f0;
    border: 3px solid #333;
    border-radius: 10px;
    padding: 6px 2px;
    font-size: 0.78rem;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .tool-btn.active {
    background: #ffde59;
    border-color: #ff3131;
    box-shadow: inset 0 0 0 2px #ff3131;
  }
  .tool-btn span.icon {
    font-size: 1.2rem;
    line-height: 1.1;
  }
  .size-badge {
    position: absolute;
    top: 2px;
    right: 4px;
    font-size: 0.65rem;
    background: #333;
    color: #fff;
    padding: 0 4px;
    border-radius: 4px;
  }

  /* 太さ選択ポップアップ */
  #brush-size-popup {
    display: none;
    background: #333;
    color: #fff;
    padding: 6px;
    border-radius: 10px;
    margin-bottom: 6px;
    justify-content: space-around;
    align-items: center;
  }
  #brush-size-popup.show {
    display: flex;
  }
  .size-dot-btn {
    background: #555;
    border: 2px solid #fff;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }
  .size-dot-btn.selected {
    background: #ff5757;
  }

  /* GUI下部パレット */
  #gui-palette-container {
    flex: 1;
    overflow-y: auto;
    border: 3px solid #333;
    border-radius: 8px;
    padding: 3px;
    background: #222;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 2px;
    align-content: start;
  }
  .gui-color {
    aspect-ratio: 1;
    cursor: pointer;
    border-radius: 2px;
    position: relative;
  }
  .gui-color.selected {
    outline: 2px solid #fff;
    z-index: 2;
    transform: scale(1.15);
  }
  .gui-color.disabled-transparent {
    opacity: 0.15;
    pointer-events: none;
  }
  .gui-color.disabled-transparent::after {
    content: "×";
    position: absolute;
    inset: 0;
    color: #fff;
    font-size: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* プレビューモーダル＆ダイアログ */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 100;
    justify-content: center;
    align-items: center;
  }
  .modal-overlay.active {
    display: flex;
  }
  #preview-canvas {
    border: 4px solid #333;
    background: #fff;
    width: 360px;
    height: 225px;
  }
</style>
</head>
<body>

<!-- スマホ縦画面警告 -->
<div id="orientation-warning">
  <div class="icon">📱</div>
  <h2>横画面専用アプリです</h2>
  <p>端末を横向きにして遊んでね！</p>
</div>

<!-- 1. タイトル画面 -->
<div id="screen-title" class="screen active" onclick="goScreen('screen-mode1')">
  <div class="title-logo">WING<span>お絵描き</span><br>PV作成！</div>
  <div class="start-blink">▶ スタート</div>
</div>

<!-- 2. メニュー１：人数選択 -->
<div id="screen-mode1" class="screen">
  <div class="card-box">
    <h2 class="card-title">プレイ人数をえらんでね！</h2>
    <button class="pop-btn blue" onclick="selectPlayMode('single')">① 一人で遊ぶ</button>
    <button class="pop-btn purple" onclick="selectPlayMode('multi')">② マルチ（5人まで）</button>
  </div>
</div>

<!-- 2-B. マルチプレイ：ホスト or ゲスト -->
<div id="screen-multi-role" class="screen">
  <div class="card-box">
    <h2 class="card-title">マルチプレイ選択</h2>
    <button class="pop-btn" onclick="goScreen('screen-multi-host-setup')">👑 ホスト（部屋をつくる）</button>
    <button class="pop-btn blue" onclick="goScreen('screen-multi-guest')">🎮 ゲスト（部屋に入る）</button>
    <br>
    <button class="pop-btn gray" style="font-size:0.9rem; padding:8px 16px;" onclick="goScreen('screen-mode1')">もどる</button>
  </div>
</div>

<!-- 2-C. マルチプレイ：ホスト人数設定 -->
<div id="screen-multi-host-setup" class="screen">
  <div class="card-box">
    <h2 class="card-title">何人で遊ぶ？（2〜5人）</h2>
    <select id="host-player-count">
      <option value="2">2人</option>
      <option value="3">3人</option>
      <option value="4">4人</option>
      <option value="5">5人</option>
    </select>
    <br><br>
    <button class="pop-btn green" onclick="createHostRoom()">決定</button>
    <button class="pop-btn gray" onclick="goScreen('screen-multi-role')">もどる</button>
  </div>
</div>

<!-- 2-D. マルチプレイ：ホスト待機画面 -->
<div id="screen-multi-host-wait" class="screen">
  <div class="card-box">
    <h2 class="card-title">みんなにパスを教えよう！</h2>
    <div class="pass-display" id="generated-pass">0000</div>
    <p id="host-wait-status">接続まち... (1 / 2人)</p>
    <!-- デモ用：全員揃ったことにして次へ進むボタン -->
    <button class="pop-btn green" onclick="goScreen('screen-mode2')">全員そろった！（ゲーム選択へ）</button>
  </div>
</div>

<!-- 2-E. マルチプレイ：ゲストパス入力 -->
<div id="screen-multi-guest" class="screen">
  <div class="card-box">
    <h2 class="card-title">4桁のパスを入力してね</h2>
    <input type="text" id="guest-pass-input" maxlength="4" placeholder="1234" inputmode="numeric">
    <br><br>
    <button class="pop-btn blue" onclick="joinGuestRoom()">接続</button>
    <button class="pop-btn gray" onclick="goScreen('screen-multi-role')">もどる</button>
  </div>
</div>

<!-- 2-F. マルチプレイ：ゲスト接続後待機 -->
<div id="screen-multi-guest-wait" class="screen">
  <div class="card-box">
    <h2 class="card-title">接続完了！</h2>
    <p>ホストがゲームを始めるまで待機しています...</p>
    <button class="pop-btn green" style="font-size:0.9rem;" onclick="goScreen('screen-mode2')">（テスト用：次へ進む）</button>
  </div>
</div>

<!-- 3. メニュー２：ゲームモード選択 -->
<div id="screen-mode2" class="screen">
  <div class="card-box">
    <h2 class="card-title">なにを作る？</h2>
    <button class="pop-btn" onclick="selectGameMode('anim')">（１）アニメーション素材</button><br>
    <button class="pop-btn blue" onclick="selectGameMode('bg')">（２）背景</button><br>
    <button class="pop-btn purple" onclick="alert('PV（合体）モードは次期アップデートで実装予定です！')">（３）PV（合体）</button>
  </div>
</div>

<!-- 4. 透明色選択画面（250色パレット） -->
<div id="screen-transparent-select" class="screen">
  <div class="card-box" style="padding: 15px 25px;">
    <h2 class="card-title" style="margin-bottom:5px;">透明にする色を1つ選んでね！</h2>
    <p style="font-size:0.85rem; margin:0 0 8px 0; color:#666;">選んだ色はGIF保存時に透明になり、お絵描きパレットでは使えなくなります</p>
    <div id="palette-250-grid"></div>
  </div>
</div>

<!-- 5. お絵描きメイン画面 -->
<div id="screen-draw" class="screen">
  <!-- 左側キャンバス -->
  <div id="canvas-viewport">
    <div id="frame-badge">1枚目 / 最大10枚</div>
    <button id="zoom-reset-btn" onclick="resetZoom()">🔍 100%に戻す</button>
    <div id="canvas-wrapper">
      <canvas id="draw-canvas" width="480" height="300"></canvas>
      <canvas id="grid-canvas" width="480" height="300"></canvas>
    </div>
  </div>

  <!-- 右側GUI -->
  <div id="gui-panel">
    <div class="tool-grid">
      <button class="tool-btn active" id="tool-pen" onclick="handleToolClick('pen')">
        <span class="size-badge" id="badge-pen">4px</span>
        <span class="icon">✏️</span>ペン
      </button>
      <button class="tool-btn" id="tool-eraser" onclick="handleToolClick('eraser')">
        <span class="size-badge" id="badge-eraser">10px</span>
        <span class="icon">🧹</span>消しゴム
      </button>
      <button class="tool-btn" id="tool-bucket" onclick="handleToolClick('bucket')">
        <span class="size-badge" id="badge-bucket">標準</span>
        <span class="icon">🪣</span>塗りつぶし
      </button>
      <button class="tool-btn" id="tool-grid" onclick="toggleGrid()">
        <span class="icon">田</span>グリッド
      </button>
      <button class="tool-btn" id="tool-undo" onclick="undo()">
        <span class="icon">←</span>戻す
      </button>
      <button class="tool-btn" id="tool-redo" onclick="redo()">
        <span class="icon">→</span>進む
      </button>
      <button class="tool-btn" onclick="saveCurrentPNG()">
        <span class="icon">💾</span>保存(PNG)
      </button>
      <button class="tool-btn" id="btn-next-frame" onclick="nextFrame()">
        <span class="icon">⏭️</span>次へ
      </button>
      <button class="tool-btn" style="background:#7ed957;" onclick="openPreview()">
        <span class="icon">🎬</span>完了
      </button>
    </div>

    <!-- ツール再タップ時のオプションバー -->
    <div id="brush-size-popup"></div>

    <!-- パレット -->
    <div id="gui-palette-container"></div>
  </div>
</div>

<!-- 6. 完了プレビュー＆GIF保存モーダル -->
<div id="modal-preview" class="modal-overlay">
  <div class="card-box">
    <h2 class="card-title">アニメーションプレビュー</h2>
    <canvas id="preview-canvas" width="480" height="300"></canvas>
    <div style="margin: 12px 0;">
      <label style="font-weight:bold;">スピード調整: <span id="speed-label">200</span> ms</label><br>
      <input type="range" id="speed-slider" min="50" max="1000" step="50" value="200" style="width:250px;" oninput="updateAnimSpeed(this.value)">
    </div>
    <button class="pop-btn green" id="btn-save-gif" onclick="exportGIF()">✨ アニメーションGIFで保存</button>
    <button class="pop-btn gray" onclick="closePreview()">もどる</button>
  </div>
</div>

<!-- 7. 保存後の確認ダイアログ -->
<div id="modal-after-save" class="modal-overlay">
  <div class="card-box">
    <h2 class="card-title">保存が完了しました！</h2>
    <p style="font-size:1.2rem; font-weight:bold;">メニュー画面へ戻りますか？</p>
    <button class="pop-btn blue" onclick="returnToMenu()">はい</button>
    <button class="pop-btn gray" onclick="closeAfterSaveDialog()">いいえ</button>
  </div>
</div>

<script>
/* ==========================================
   1. 250色カラーパレット生成
========================================== */
const PALETTE_250 = [];
(function generate250Colors() {
  // 10段階グレースケール
  for (let i = 0; i < 10; i++) {
    const v = Math.round((255 / 9) * i);
    const hex = '#' + [v, v, v].map(x => x.toString(16).padStart(2, '0')).join('');
    PALETTE_250.push(hex);
  }
  // 24色相 × 10明度・彩度バリエーション = 240色 (合計250色)
  const hues = 24;
  const tones = [
    [100, 85], [100, 70], [100, 55], [100, 45], [100, 30],
    [70, 80],  [70, 60],  [70, 40],  [45, 75],  [45, 45]
  ];
  for (let h = 0; h < hues; h++) {
    const hue = Math.round((360 / hues) * h);
    for (let t = 0; t < tones.length; t++) {
      PALETTE_250.push(hslToHex(hue, tones[t][0], tones[t][1]));
    }
  }
})();

function hslToHex(h, s, l) {
  l /= 100;
  const a = s * Math.min(l, 1 - l) / 100;
  const f = n => {
    const k = (n + h / 30) % 12;
    const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
    return Math.round(255 * color).toString(16).padStart(2, '0');
  };
  return `#${f(0)}${f(8)}${f(4)}`;
}

/* ==========================================
   2. 画面遷移とゲームステート管理
========================================== */
let gameState = {
  playMode: 'single',
  gameMode: 'anim',
  transparentColor: null,
  currentColor: '#000000',
  currentTool: 'pen',
  penSize: 4,
  eraserSize: 10,
  bucketTolerance: 10,
  gridVisible: false,
  frames: [], // ImageData配列（最大10枚）
  currentFrameIndex: 0,
  history: [], // 現在のフレームのUndo履歴
  redoStack: []
};

function goScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function selectPlayMode(mode) {
  gameState.playMode = mode;
  if (mode === 'single') {
    goScreen('screen-mode2');
  } else {
    goScreen('screen-multi-role');
  }
}

function createHostRoom() {
  const count = document.getElementById('host-player-count').value;
  const pass = Math.floor(1000 + Math.random() * 9000);
  document.getElementById('generated-pass').textContent = pass;
  document.getElementById('host-wait-status').textContent = `接続まち... (1 / ${count}人)`;
  goScreen('screen-multi-host-wait');
}

function joinGuestRoom() {
  const val = document.getElementById('guest-pass-input').value;
  if (!/^\d{4}$/.test(val)) {
    alert('4桁の数字を入力してください');
    return;
  }
  goScreen('screen-multi-guest-wait');
}

function selectGameMode(mode) {
  gameState.gameMode = mode;
  if (mode === 'anim') {
    renderTransparentSelector();
    goScreen('screen-transparent-select');
  } else {
    gameState.transparentColor = null;
    initDrawingSession();
    goScreen('screen-draw');
  }
}

function renderTransparentSelector() {
  const grid = document.getElementById('palette-250-grid');
  grid.innerHTML = '';
  PALETTE_250.forEach(hex => {
    const cell = document.createElement('div');
    cell.className = 'color-cell';
    cell.style.backgroundColor = hex;
    cell.onclick = () => {
      gameState.transparentColor = hex;
      initDrawingSession();
      goScreen('screen-draw');
    };
    grid.appendChild(cell);
  });
}

/* ==========================================
   3. お絵描きエンジン＆ツール制御
========================================== */
const canvas = document.getElementById('draw-canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const gridCanvas = document.getElementById('grid-canvas');
const gridCtx = gridCanvas.getContext('2d');

function initDrawingSession() {
  ctx.clearRect(0, 0, 480, 300);
  // 背景モードの場合は白で初期化
  if (gameState.gameMode === 'bg') {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, 480, 300);
  }
  gameState.frames = [ctx.getImageData(0, 0, 480, 300)];
  gameState.currentFrameIndex = 0;
  gameState.history = [ctx.getImageData(0, 0, 480, 300)];
  gameState.redoStack = [];
  updateFrameUI();
  renderGuiPalette();
  drawGridLines();
  resetZoom();
}

function renderGuiPalette() {
  const container = document.getElementById('gui-palette-container');
  container.innerHTML = '';
  // 初期選択色が透明色と被っていたら別の色にする
  if (gameState.currentColor === gameState.transparentColor) {
    gameState.currentColor = PALETTE_250.find(c => c !== gameState.transparentColor);
  }

  PALETTE_250.forEach(hex => {
    const div = document.createElement('div');
    div.className = 'gui-color';
    div.style.backgroundColor = hex;
    if (hex === gameState.transparentColor) {
      div.classList.add('disabled-transparent');
    } else {
      if (hex === gameState.currentColor) div.classList.add('selected');
      div.onclick = () => {
        gameState.currentColor = hex;
        document.querySelectorAll('.gui-color').forEach(el => el.classList.remove('selected'));
        div.classList.add('selected');
      };
    }
    container.appendChild(div);
  });
}

// ツール選択＆再タップ時の太さ・設定ポップアップ
function handleToolClick(tool) {
  const popup = document.getElementById('brush-size-popup');
  const isSameTool = (gameState.currentTool === tool);

  gameState.currentTool = tool;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tool-' + tool).classList.add('active');
  if (gameState.gridVisible) document.getElementById('tool-grid').classList.add('active');

  if (isSameTool) {
    // 決定状態で再タップされたらオプション表示切替
    if (popup.classList.contains('show')) {
      popup.classList.remove('show');
    } else {
      renderToolOptions(tool);
      popup.classList.add('show');
    }
  } else {
    popup.classList.remove('show');
  }
}

function renderToolOptions(tool) {
  const popup = document.getElementById('brush-size-popup');
  popup.innerHTML = '';
  if (tool === 'pen') {
    [2, 4, 8, 16].forEach(sz => {
      const btn = document.createElement('div');
      btn.className = 'size-dot-btn' + (gameState.penSize === sz ? ' selected' : '');
      btn.innerHTML = `<div style="width:${sz}px;height:${sz}px;background:#fff;border-radius:50%;"></div>`;
      btn.onclick = () => {
        gameState.penSize = sz;
        document.getElementById('badge-pen').textContent = sz + 'px';
        popup.classList.remove('show');
      };
      popup.appendChild(btn);
    });
  } else if (tool === 'eraser') {
    [6, 12, 24, 40].forEach(sz => {
      const btn = document.createElement('div');
      btn.className = 'size-dot-btn' + (gameState.eraserSize === sz ? ' selected' : '');
      btn.style.fontSize = '10px';
      btn.textContent = sz;
      btn.onclick = () => {
        gameState.eraserSize = sz;
        document.getElementById('badge-eraser').textContent = sz + 'px';
        popup.classList.remove('show');
      };
      popup.appendChild(btn);
    });
  } else if (tool === 'bucket') {
    [{label:'厳密', val:5}, {label:'標準', val:25}, {label:'広め', val:60}].forEach(opt => {
      const btn = document.createElement('button');
      btn.style.cssText = 'background:#555;color:#fff;border:1px solid #fff;border-radius:6px;padding:4px 8px;font-size:12px;';
      btn.textContent = opt.label;
      btn.onclick = () => {
        gameState.bucketTolerance = opt.val;
        document.getElementById('badge-bucket').textContent = opt.label;
        popup.classList.remove('show');
      };
      popup.appendChild(btn);
    });
  }
}

// グリッド（縦72px × 横60px）
function drawGridLines() {
  gridCtx.clearRect(0, 0, 480, 300);
  gridCtx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
  gridCtx.lineWidth = 1;
  gridCtx.setLineDash([3, 3]);

  // 横60px間隔（縦線）
  for (let x = 60; x < 480; x += 60) {
    gridCtx.beginPath();
    gridCtx.moveTo(x, 0);
    gridCtx.lineTo(x, 300);
    gridCtx.stroke();
  }
  // 縦72px間隔（横線）
  for (let y = 72; y < 300; y += 72) {
    gridCtx.beginPath();
    gridCtx.moveTo(0, y);
    gridCtx.lineTo(480, y);
    gridCtx.stroke();
  }
}

function toggleGrid() {
  gameState.gridVisible = !gameState.gridVisible;
  gridCanvas.style.display = gameState.gridVisible ? 'block' : 'none';
  document.getElementById('tool-grid').classList.toggle('active', gameState.gridVisible);
}

// Undo / Redo
function saveHistoryState() {
  const snap = ctx.getImageData(0, 0, 480, 300);
  gameState.history.push(snap);
  if (gameState.history.length > 30) gameState.history.shift();
  gameState.redoStack = [];
  gameState.frames[gameState.currentFrameIndex] = snap;
}

function undo() {
  if (gameState.history.length <= 1) return;
  const current = gameState.history.pop();
  gameState.redoStack.push(current);
  const prev = gameState.history[gameState.history.length - 1];
  ctx.putImageData(prev, 0, 0);
  gameState.frames[gameState.currentFrameIndex] = prev;
}

function redo() {
  if (gameState.redoStack.length === 0) return;
  const next = gameState.redoStack.pop();
  gameState.history.push(next);
  ctx.putImageData(next, 0, 0);
  gameState.frames[gameState.currentFrameIndex] = next;
}

/* ==========================================
   4. 描画処理＆ピンチズーム操作
========================================== */
const viewport = document.getElementById('canvas-viewport');
const wrapper = document.getElementById('canvas-wrapper');
let scale = 1, panX = 0, panY = 0;
let isDrawing = false;
let lastX = 0, lastY = 0;

// マルチタッチピンチ用
let initialPinchDist = null;
let initialScale = 1;

function updateTransform() {
  wrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
}

function resetZoom() {
  scale = 1;
  panX = 0;
  panY = 0;
  updateTransform();
}

function getCanvasCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const x = (clientX - rect.left) * (480 / rect.width);
  const y = (clientY - rect.top) * (300 / rect.height);
  return { x: Math.floor(x), y: Math.floor(y) };
}

// タッチイベント（1本指＝描画、2本指＝ピンチズーム）
viewport.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    isDrawing = false;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    initialPinchDist = Math.hypot(dx, dy);
    initialScale = scale;
  } else if (e.touches.length === 1) {
    const pt = getCanvasCoords(e.touches[0].clientX, e.touches[0].clientY);
    startStroke(pt.x, pt.y);
  }
}, { passive: false });

viewport.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 2 && initialPinchDist) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    scale = Math.min(Math.max(0.5, initialScale * (dist / initialPinchDist)), 4);
    updateTransform();
  } else if (e.touches.length === 1 && isDrawing) {
    const pt = getCanvasCoords(e.touches[0].clientX, e.touches[0].clientY);
    moveStroke(pt.x, pt.y);
  }
}, { passive: false });

viewport.addEventListener('touchend', e => {
  if (e.touches.length < 2) initialPinchDist = null;
  if (isDrawing) endStroke();
});

// マウスイベント（PC用）
canvas.addEventListener('mousedown', e => {
  const pt = getCanvasCoords(e.clientX, e.clientY);
  startStroke(pt.x, pt.y);
});
window.addEventListener('mousemove', e => {
  if (!isDrawing) return;
  const pt = getCanvasCoords(e.clientX, e.clientY);
  moveStroke(pt.x, pt.y);
});
window.addEventListener('mouseup', () => {
  if (isDrawing) endStroke();
});
viewport.addEventListener('wheel', e => {
  e.preventDefault();
  scale = Math.min(Math.max(0.5, scale - e.deltaY * 0.001), 4);
  updateTransform();
}, { passive: false });

function startStroke(x, y) {
  if (x < 0 || x >= 480 || y < 0 || y >= 300) return;
  if (gameState.currentTool === 'bucket') {
    floodFill(x, y, gameState.currentColor, gameState.bucketTolerance);
    saveHistoryState();
    return;
  }
  isDrawing = true;
  lastX = x;
  lastY = y;
  drawDot(x, y);
}

function moveStroke(x, y) {
  if (!isDrawing) return;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (gameState.currentTool === 'pen') {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = gameState.currentColor;
    ctx.lineWidth = gameState.penSize;
  } else if (gameState.currentTool === 'eraser') {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = gameState.eraserSize;
  }
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(x, y);
  ctx.stroke();
  lastX = x;
  lastY = y;
}

function drawDot(x, y) {
  if (gameState.currentTool === 'pen') {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = gameState.currentColor;
    ctx.beginPath();
    ctx.arc(x, y, gameState.penSize / 2, 0, Math.PI * 2);
    ctx.fill();
  } else if (gameState.currentTool === 'eraser') {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x, y, gameState.eraserSize / 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

function endStroke() {
  isDrawing = false;
  ctx.globalCompositeOperation = 'source-over';
  saveHistoryState();
}

// 塗りつぶしアルゴリズム
function floodFill(startX, startY, fillHex, tolerance) {
  const imgData = ctx.getImageData(0, 0, 480, 300);
  const data = imgData.data;
  const startPos = (startY * 480 + startX) * 4;
  const sr = data[startPos], sg = data[startPos + 1], sb = data[startPos + 2], sa = data[startPos + 3];

  const fr = parseInt(fillHex.slice(1, 3), 16);
  const fg = parseInt(fillHex.slice(3, 5), 16);
  const fb = parseInt(fillHex.slice(5, 7), 16);

  if (sr === fr && sg === fg && sb === fb && sa === 255) return;

  const visited = new Uint8Array(480 * 300);
  const stack = [[startX, startY]];

  while (stack.length > 0) {
    const [x, y] = stack.pop();
    const idx = y * 480 + x;
    if (visited[idx]) continue;
    visited[idx] = 1;

    const pos = idx * 4;
    const diff = Math.abs(data[pos] - sr) + Math.abs(data[pos+1] - sg) + Math.abs(data[pos+2] - sb) + Math.abs(data[pos+3] - sa);
    if (diff <= tolerance) {
      data[pos] = fr;
      data[pos + 1] = fg;
      data[pos + 2] = fb;
      data[pos + 3] = 255;

      if (x > 0) stack.push([x - 1, y]);
      if (x < 479) stack.push([x + 1, y]);
      if (y > 0) stack.push([x, y - 1]);
      if (y < 299) stack.push([x, y + 1]);
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

/* ==========================================
   5. フレーム進行（最大10枚）・保存・GIF書き出し
========================================== */
function updateFrameUI() {
  const current = gameState.currentFrameIndex + 1;
  const total = gameState.frames.length;
  document.getElementById('frame-badge').textContent = `${current}枚目 (全${total}枚 / 最大10枚)`;
  document.getElementById('btn-next-frame').disabled = (current >= 10);
}

function nextFrame() {
  if (gameState.currentFrameIndex >= 9) return;
  // 現在のフレームを保存
  gameState.frames[gameState.currentFrameIndex] = ctx.getImageData(0, 0, 480, 300);
  gameState.currentFrameIndex++;

  if (gameState.frames[gameState.currentFrameIndex]) {
    ctx.putImageData(gameState.frames[gameState.currentFrameIndex], 0, 0);
  } else {
    // 前の絵を薄く残さず新規キャンバス（背景モードなら白）
    ctx.clearRect(0, 0, 480, 300);
    if (gameState.gameMode === 'bg') {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 480, 300);
    }
    gameState.frames.push(ctx.getImageData(0, 0, 480, 300));
  }
  gameState.history = [ctx.getImageData(0, 0, 480, 300)];
  gameState.redoStack = [];
  updateFrameUI();
}

// PNG保存
function saveCurrentPNG() {
  const link = document.createElement('a');
  link.download = `wing_art_frame${gameState.currentFrameIndex + 1}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
  openAfterSaveDialog();
}

// 完了プレビュー
let previewTimer = null;
let previewIndex = 0;
let previewSpeed = 200;

function openPreview() {
  gameState.frames[gameState.currentFrameIndex] = ctx.getImageData(0, 0, 480, 300);
  previewIndex = 0;
  document.getElementById('modal-preview').classList.add('active');
  startPreviewLoop();
}

function closePreview() {
  clearInterval(previewTimer);
  document.getElementById('modal-preview').classList.remove('active');
}

function updateAnimSpeed(val) {
  previewSpeed = Number(val);
  document.getElementById('speed-label').textContent = val;
  startPreviewLoop();
}

function startPreviewLoop() {
  clearInterval(previewTimer);
  const pCanvas = document.getElementById('preview-canvas');
  const pCtx = pCanvas.getContext('2d');

  const drawStep = () => {
    pCtx.clearRect(0, 0, 480, 300);
    pCtx.putImageData(gameState.frames[previewIndex], 0, 0);
    previewIndex = (previewIndex + 1) % gameState.frames.length;
  };
  drawStep();
  previewTimer = setInterval(drawStep, previewSpeed);
}

// アニメーションGIF書き出し
async function exportGIF() {
  const btn = document.getElementById('btn-save-gif');
  btn.disabled = true;
  btn.textContent = 'GIF生成中...';

  // CORS制限回避のためWorkerをBlob生成
  const workerBlob = await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js')
    .then(res => res.text())
    .then(txt => new Blob([txt], { type: 'application/javascript' }));
  const workerUrl = URL.createObjectURL(workerBlob);

  // 透明色のRGB値取得
  let transHexInt = null;
  if (gameState.transparentColor) {
    transHexInt = parseInt(gameState.transparentColor.slice(1), 16);
  }

  const gif = new GIF({
    workers: 2,
    quality: 10,
    width: 480,
    height: 300,
    workerScript: workerUrl,
    transparent: transHexInt
  });

  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = 480;
  tempCanvas.height = 300;
  const tempCtx = tempCanvas.getContext('2d');

  gameState.frames.forEach(frameData => {
    tempCtx.clearRect(0, 0, 480, 300);
    // 透明色が指定されている場合、完全透明ピクセルを指定色で埋めてGIF透過させる
    if (gameState.transparentColor) {
      tempCtx.fillStyle = gameState.transparentColor;
      tempCtx.fillRect(0, 0, 480, 300);
      const off = document.createElement('canvas');
      off.width = 480; off.height = 300;
      off.getContext('2d').putImageData(frameData, 0, 0);
      tempCtx.drawImage(off, 0, 0);
    } else {
      tempCtx.putImageData(frameData, 0, 0);
    }
    gif.addFrame(tempCtx, { copy: true, delay: previewSpeed });
  });

  gif.on('finished', blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'wing_animation.gif';
    a.click();

    btn.disabled = false;
    btn.textContent = '✨ アニメーションGIFで保存';
    closePreview();
    openAfterSaveDialog();
  });

  gif.render();
}

// 保存後のダイアログ
function openAfterSaveDialog() {
  document.getElementById('modal-after-save').classList.add('active');
}
function closeAfterSaveDialog() {
  document.getElementById('modal-after-save').classList.remove('active');
}
function returnToMenu() {
  closeAfterSaveDialog();
  goScreen('screen-mode2');
}
</script>
